plugins {
    id 'java-library'
    id 'maven-publish'
    id 'com.gradleup.shadow' version '8.3.6'
}

group = rootProject.group
version = rootProject.version

dependencies {
    implementation project(':api')

    compileOnly "org.apache.jmeter:ApacheJMeter_core:${rootProject.ext.jmeterVersion}"
    compileOnly "org.apache.jmeter:ApacheJMeter_java:${rootProject.ext.jmeterVersion}"

    implementation "org.apache.kafka:kafka-clients:${rootProject.ext.kafkaVersion}"
    implementation 'org.slf4j:slf4j-api:2.0.7'

    compileOnly 'com.google.code.gson:gson:2.10.1'

    testImplementation "org.apache.jmeter:ApacheJMeter_core:${rootProject.ext.jmeterVersion}"
    testImplementation "org.apache.jmeter:ApacheJMeter_java:${rootProject.ext.jmeterVersion}"
    testImplementation 'junit:junit:4.13.2'
}

tasks.named('jar') {
    enabled = false
}

tasks.named('shadowJar', com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar) {
    archiveBaseName = 'jmeter-kafka-sampler'
    archiveVersion = project.version.toString()
    archiveClassifier = ''

    dependencies {
        exclude(dependency('org.apache.jmeter:.*:.*'))
    }

    mergeServiceFiles()
}

tasks.named('assemble') {
    dependsOn tasks.named('shadowJar')
}

publishing {
    publications {
        pluginRuntime(MavenPublication) {
            artifactId = 'jmeter-kafka-sampler'
            artifact tasks.named('shadowJar')
            artifact tasks.named('sourcesJar')
            artifact tasks.named('javadocJar')

            pom {
                name = 'JMeter Kafka Plugin'
                description = 'JMeter sampler plugin for generating load-test Kafka messages using custom producer implementations.'
            }
        }
    }
}
